<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Study RPG</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- TOP UI -->
        <header class="top-bar panel">
            <div class="status-row">
                <div class="survival-status">
                    <span class="label">Time to Death</span>
                    <div id="death-timer" class="neon-text">24:00:00</div>
                </div>
                
                <div class="inventory">
                    <img src="assets/cert.png" alt="Cert" class="cert-icon">
                    <span id="cert-count">x0</span>
                </div>
            </div>
            
            <div class="weekly-progress">
                <div class="label">Weekly Quest (14h)</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="weekly-fill"></div>
                </div>
                <div class="progress-text" id="weekly-text">0h 0m / 14h</div>
            </div>

            <div class="player-stats">
                <div id="player-level" class="level-text">LV 1</div>
                <div class="exp-bar">
                    <div class="exp-fill" id="exp-fill"></div>
                </div>
                <div id="player-exp" class="exp-text">0 EXP</div>
            </div>
        </header>

        <!-- CENTER DISPLAY -->
        <main class="pixel-display">
            <div class="background-layer" id="bg-layer"></div>
            <div class="character-layer">
                <img id="character-sprite" src="assets/character.png" alt="Character">
            </div>
            <div id="study-timer" class="hidden">00:00:00</div>
            <div id="game-message" class="hidden"></div>
        </main>

        <!-- BOTTOM CONTROLS -->
        <footer class="bottom-controls panel">
            <div class="main-buttons">
                <button id="btn-toggle-study" class="btn btn-primary">Start Study</button>
            </div>
            <div class="secondary-buttons">
                <button id="btn-use-cert" class="btn btn-item">Use Item</button>
                <button id="btn-show-stats" class="btn btn-info">Legacy</button>
            </div>
        </footer>
    </div>
    
    <!-- MODALS -->
    <div id="modal-records" class="modal hidden">
        <div class="modal-content panel">
            <h2>Legacy Records</h2>
            <div class="records-container">
                <ul id="records-list"></ul>
            </div>
            <button id="btn-close-records" class="btn">Close</button>
        </div>
    </div>
    
    <div id="modal-gameover" class="modal hidden">
        <div class="modal-content panel death-panel">
            <h2 class="death-title">YOU DIED</h2>
            <p id="death-reason" class="death-reason"></p>
            <div class="death-stats">
                <p>Final Level: <span id="final-level"></span></p>
                <p>Survived: <span id="survival-days"></span> Days</p>
            </div>
            <button id="btn-restart" class="btn btn-danger">Reincarnate</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
